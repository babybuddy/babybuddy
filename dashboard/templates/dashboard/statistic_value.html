{% load duration i18n %}
{% if stat.stat %}
    {% if stat.type == "duration" %}
        {{ stat.stat|duration_string:'m' }}
    {% elif stat.type == "float" %}
        {{ stat.stat|floatformat }}
    {% else %}
        {{ stat.stat }}
    {% endif %}
{% else %}
    <em>{% trans "Not enough data" %}</em>
{% endif %}
